name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Maven
        uses: stcarolas/setup-maven@v4
        with:
          maven-version: '3.9.9'

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Copy frontend to backend static
        run: |
          if (Test-Path backend\src\main\resources\static) { Remove-Item -Recurse -Force backend\src\main\resources\static }
          Copy-Item -Recurse -Force frontend\dist backend\src\main\resources\static

      - name: Build JAR
        run: |
          cd backend
          mvn package -DskipTests -q

      # 로컬 build-exe.bat 과 동일: app-image (WiX 없이 폴더+실행파일). 단일 exe 설치형은 WiX 필요.
      - name: Create Windows app bundle (jpackage app-image)
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          if (Test-Path "dist\승무원라인팀편성") { Remove-Item -Recurse -Force "dist\승무원라인팀편성" }
          jpackage `
            --type app-image `
            --name "승무원라인팀편성" `
            --app-version 1.0 `
            --input backend/target `
            --main-jar line-team-assignment-0.0.1-SNAPSHOT.jar `
            --dest dist `
            --win-console `
            --java-options "-Dserver.port=8080"
          if (Test-Path "사용방법-EXE설치후.txt") {
            Copy-Item -Force "사용방법-EXE설치후.txt" "dist\승무원라인팀편성\사용방법-EXE설치후.txt"
          }

      - name: Upload Windows bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: LineTeam_Generator-Windows
          path: dist/

      - name: Get version for release
        id: version
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            echo "VERSION=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "VERSION=v1.0.0-build.${{ github.run_number }}" >> $env:GITHUB_OUTPUT
          }

      - name: Create Release (on tag only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
