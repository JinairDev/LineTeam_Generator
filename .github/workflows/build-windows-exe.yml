name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Maven
        uses: stcarolas/setup-maven@v4
        with:
          maven-version: '3.9.9'

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Copy frontend to backend static
        run: |
          if (Test-Path backend\src\main\resources\static) { Remove-Item -Recurse -Force backend\src\main\resources\static }
          Copy-Item -Recurse -Force frontend\dist backend\src\main\resources\static

      - name: Build JAR
        run: |
          cd backend
          mvn package -DskipTests -q

      - name: Create EXE with jpackage
        run: |
          New-Item -ItemType Directory -Force -Path dist
          cd backend
          jpackage --type exe --name "LineTeam_Generator" --input target --main-jar line-team-assignment-0.0.1-SNAPSHOT.jar --main-class com.crew.lineteam.CrewLineTeamApplication --dest ..\dist --win-console --java-options "-Dcrew.lineteam.openBrowser=true"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: LineTeam_Generator-Windows
          path: dist/

      - name: Get version for release
        id: version
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            echo "VERSION=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "VERSION=v1.0.0-build.${{ github.run_number }}" >> $env:GITHUB_OUTPUT
          }

      - name: Create Release (on tag only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
