# Google CSV 등 HTTPS: Java 21+에서 OS 신뢰 저장소 사용은 CrewLineTeamApplication.main 에서 기본 활성화.
# 필요 시 실행 옵션으로 끄기: -Djdk.tls.client.useSystemTrustStore=false
#
# SASE/SSL 검사 등으로 PKIX가 계속 나면 true (서버 인증서 검증 생략 — 신뢰할 수 있는 네트워크에서만 사용)
google.sheets.trust-all-certificates=true
server.port=8765
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.enabled=true
